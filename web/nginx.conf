server {
    listen 8080;
    server_name localhost;
    client_max_body_size 80m;
    access_log off;
    location = /api/v1/bot/instances {
        error_page 418 = @instance_write;
        if ($request_method != GET) { return 418; }
        proxy_pass http://127.0.0.1:8089;
    }
    location ~ ^/api/v1/bot/i/[0-9a-f-]+/settings$ {
        proxy_pass http://127.0.0.1:8089;
    }
    location @instance_write {
        proxy_pass http://127.0.0.1:8087;
    }
    location /branding/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
    location ~ ^/themes/[^/]+\.css$ {
        rewrite ^ /themes/darkly.css break;
        proxy_pass http://127.0.0.1:8087;
    }
    location ~* ^/api/v1/(?:bot|b/[^/]+)/(?:store(?:Download|Version)|i/[^/]+/(?:scripts|scriptSettings))(?:/|$) { return 404; }
    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
        sub_filter_once off;
        sub_filter '"discord"==i.backend&&!i.authId' 'false';
        sub_filter 'src="/js/base.js"' 'src="/js/base.js?v=discord-music-instance"';
        sub_filter "<li ng-if=\"hasPriv(userInfo, PRIV_EDITBOT)\" ui-sref-active=\"active\"><a ui-sref=\"app.settings.scripts\">{{\\'Scripts\\'|t}}</a></li>" '';
        sub_filter "<li ng-if=\"hasPriv(userInfo, PRIV_EDITBOT) && hasFeature(userInfo, FEATURE_STORE)\" ui-sref-active=\"active\"><a ui-sref=\"app.settings.store\">{{\\'Addons\\'|t}}</a></li>" '';

        sub_filter "<li ui-sref-active=\"active\"><a ui-sref=\"app.help\">{{::'Help'|t}}</a></li>" '';
        sub_filter "<li role=\"presentation\" ng-class=\"{\\'active\\': tab == \\'changes\\'}\"><a href ng-click=\"tab = \\'changes\\'\">{{\\'Changelog\\'|t}}</a></li>" '';
        sub_filter "<li role=\"presentation\" ng-class=\"{\\'active\\': tab == \\'about\\'}\"><a href ng-click=\"tab = \\'about\\'\">{{\\'About...\\'|t}}</a></li>" '';

        sub_filter 'src="/js/partials.js"' 'src="/js/partials.js?v=muziekwijf-noextensions"';
        sub_filter_types application/javascript text/javascript;
        sub_filter 'placeholder="theSinusBot"' 'placeholder="Discord Music"';
        sub_filter '<title>SinusBot</title>' '<title>Discord Music</title>';
        sub_filter '</body>' '<script src="/branding/layout.js?v=1" defer></script></body>';
        sub_filter '</head>' '<link rel="stylesheet" href="/branding/calm.css"><link rel="icon" type="image/svg+xml" href="/branding/icon.svg"></head>';
        sub_filter '<img height="18" src="/img/sinusbot-logo.png" style="height:18px!important;width:124px!important;display:block!important">' '<span class="mw-brand"><img src="/branding/icon.svg" alt="" width="28" height="28"><span class="instance-label" ng-bind="(instances | filter:{uuid:currentInstanceId}:true)[0].name || &quot;Discord Music&quot;">Discord Music</span></span>';
    }
}
