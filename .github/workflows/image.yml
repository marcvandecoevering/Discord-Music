name: Build and publish
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t discord-music:test .
      - name: Verify web player, DAVE and audio
        run: |
          docker run -d --name qa -e WEB_ONLY=1 -e SINUSBOT_PASSWORD=ci-test discord-music:test
          timeout 180 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" qa)" = healthy ]; do sleep 2; done'
          docker exec qa node --test /app/sinusbot.test.js
          docker exec -e SINUSBOT_URL=http://127.0.0.1:8087 qa node /app/smoke.js
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag discord-music:test "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          docker tag discord-music:test "$image:latest"
          docker push "$image:latest"
