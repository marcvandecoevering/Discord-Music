name: Build and publish
on:
  pull_request:
  push:
    branches: [main, codex/independent-player]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci && npm test
      - run: docker build -t discord-music:test .
      - name: Verify independent startup and audio
        run: |
          docker run -d --name qa --network none -e DISCORD_DISABLED=1 -e DISCORD_MUSIC_ADMIN_PASSWORD=integration-test discord-music:test
          timeout 60 bash -c 'until [ "$(docker inspect -f "{{.State.Health.Status}}" qa)" = healthy ]; do sleep 2; done'
          docker cp test qa:/app/test
          docker exec qa node /app/test/integration.mjs
          docker exec qa node /app/test/audio.mjs
          docker exec qa node /app/test/transport.mjs
          docker exec qa sh -c 'test ! -e /opt/player/sinusbot && test ! -e /opt/sinusbot && test ! -e /app/bridge'
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: github.event_name != 'pull_request'
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag=independent
          if [ "$GITHUB_REF" = refs/heads/main ]; then tag=latest; fi
          docker tag discord-music:test "$image:$GITHUB_SHA"
          docker push "$image:$GITHUB_SHA"
          docker tag discord-music:test "$image:$tag"
          docker push "$image:$tag"
      - if: failure()
        run: docker logs qa || true
